<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tarefa</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="detail">
  <div class="card">
    <header data-tauri-drag-region>
      <div class="title" data-tauri-drag-region>
        <span class="dot" data-tauri-drag-region></span>
        <span id="crumb" data-tauri-drag-region>Tarefa</span>
      </div>
      <div class="actions">
        <button id="btn-copy" title="Copiar link da tarefa">
          <svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>
        </button>
        <button id="btn-open" title="Abrir no monday">
          <svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        </button>
        <button id="btn-reload" title="Recarregar">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>
        </button>
        <button id="btn-close" title="Fechar">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </header>

    <main id="content">
      <div class="empty">Carregando…</div>
    </main>

    <footer data-tauri-drag-region>
      <span id="footer" data-tauri-drag-region></span>
      <span id="grip" class="grip" title="Redimensionar"></span>
    </footer>
  </div>
  <script src="common.js"></script>
  <script src="detail.js"></script>
</body>
</html>
