[package]
name = "monday-widget"
version = "0.1.0"
description = "Widget de área de trabalho para o monday.com"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"
ureq = { version = "2", features = ["json"] }
keyring = { version = "3", features = ["windows-native"] }

# Binário pequeno e enxuto em memória
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
